[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moleditpy-openbabel-converter"
version = "1.0.0"
description = "Isolated Open Babel file import and export for MoleditPy 5"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "LICENSING.md"]
authors = [{name = "HiroYokoyama"}]
dependencies = []

[project.optional-dependencies]
engine = ["openbabel>=3.2.1,<3.3"]
test = ["pytest", "pytest-qt", "PySide6-Essentials>=6.10,<6.13", "rdkit>=2025.9,<2027", "packaging"]

[tool.setuptools.packages.find]
include = ["openbabel_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_gui", "tests_native"]
qt_api = "pyside6"

[tool.ruff]
# Common tool copies are validated and formatted only in their canonical repositories.
extend-exclude = ["scripts/release_common.py"]

target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
